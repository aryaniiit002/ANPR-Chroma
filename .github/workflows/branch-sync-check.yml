name: Multi-Service Sonar Scan

on:
  pull_request:
    paths:
      - 'ANPR_Chroma/**'
      - 'ANPR_Infrared/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            chroma:
              - 'ANPR_Chroma/**'
            infrared:
              - 'ANPR_Infrared/**'

      - id: set-matrix
        run: |
          MATRIX="["

          if [ "${{ steps.filter.outputs.chroma }}" == "true" ]; then
            MATRIX="$MATRIX{\"id\":\"chroma\",\"path\":\"ANPR_Chroma\",\"sonar_key\":\"Github_Actions\"},"
          fi

          if [ "${{ steps.filter.outputs.infrared }}" == "true" ]; then
            MATRIX="$MATRIX{\"id\":\"infrared\",\"path\":\"ANPR_Infrared\",\"sonar_key\":\"Github_Actions\"},"
          fi

          MATRIX="${MATRIX%,}]"  # Remove trailing comma and close array

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  sonar-scan:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

#      - name: Install dependencies
#        run: |
#          pip install -r ${{ matrix.path }}/requirements.txt
#          pip install coverage
#
#      - name: Run tests
#        run: |
#          cd ${{ matrix.path }}
#          coverage run -m pytest
#          coverage xml
      - name: Test SonarQube server connectivity
        run: |
          curl -I ${{ secrets.SONAR_HOST_URL }}
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        with:
          projectBaseDir: ${{ matrix.path }}
          args: |
            -Dsonar.projectKey=${{ matrix.sonar_key }}
            -Dsonar.sources=.
            -Dsonar.verbose=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

#Comment: >
#  🧠 Benefits
#  Only scans the services that changed in the PR
#  Each SonarQube project stays separate and focused
#  Easy to scale with more services (just update the matrix)
