name: Multi-Service Sonar Scan

on:
  pull_request:
    paths:
      - 'ANPR_Chroma/**'
      - 'ANPR_Infrared/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      chroma_changed: ${{ steps.filter.outputs.chroma }}
      infrared_changed: ${{ steps.filter.outputs.infrared }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            chroma:
              - 'ANPR_Chroma/**'
            infrared:
              - 'ANPR_Infrared/**'

  sonar-scan:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - id: chroma
            changed: ${{ needs.detect-changes.outputs.chroma_changed == 'true' }}
            path: ANPR_Chroma
            sonar_key: Github_Actions
          - id: infrared
            changed: ${{ needs.detect-changes.outputs.infrared_changed == 'true' }}
            path: ANPR_Infrared
            sonar_key: anpr_infrared
    if: matrix.changed == true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

#      - name: Install dependencies
#        run: |
#          pip install -r ${{ matrix.path }}/requirements.txt
#          pip install coverage
#
#      - name: Run tests
#        run: |
#          cd ${{ matrix.path }}
#          coverage run -m pytest
#          coverage xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        with:
          projectBaseDir: ${{ matrix.path }}
          args: |
            -Dsonar.projectKey=${{ matrix.sonar_key }}
            -Dsonar.sources=.
            -Dsonar.verbose=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

#Comment: >
#  🧠 Benefits
#  Only scans the services that changed in the PR
#  Each SonarQube project stays separate and focused
#  Easy to scale with more services (just update the matrix)
