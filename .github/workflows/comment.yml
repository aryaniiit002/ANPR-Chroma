name: Check Latest Pull

on:
  pull_request:
    types:
      - synchronize
      - opened
      - reopened

jobs:
  check_pull_request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Fetch latest changes
        run: git fetch --prune --unshallow

      - name: Check pull request branch
        id: check_sync
        run: |
          git checkout ${{ github.event.pull_request.head.ref }}
          git merge-base --is-ancestor ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
          if [ $? -eq 0 ]; then
            echo "Branch is up to date."
          else
            echo "Branch is behind base."
            exit 1
          fi

      - name: Comment if behind base
        if: failure()
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ⚠️ This PR branch is **behind** the base branch `${{ github.event.pull_request.base.ref }}`.
            Please rebase or merge the latest changes from the base branch.
