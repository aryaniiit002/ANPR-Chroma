name: Manual Sync Trigger Test

on:
  issue_comment:
    types: [created]

jobs:
  test-sync-trigger:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '#sync-check')
    runs-on: ubuntu-latest

    steps:
      - name: Show the comment
        run: echo "Received comment: ${{ github.event.comment.body }}"

      - name: Comment back on the PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            🚀 **Manual sync check triggered!**
            - You commented: `${{ github.event.comment.body }}`
          token: ${{ secrets.GITHUB_TOKEN }}
